name: Regenerate Profile Assets

on:
  push:
    branches: ['upgrade/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate assets
        run: python generator.py

      - name: Validate generated assets
        run: python validate_assets.py

      - name: Commit generated artifacts when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md output/*.svg preview/*
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git commit -m "chore: regenerate profile assets"
          git push
