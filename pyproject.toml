[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-command-center"
version = "1.0.0"
description = "Deterministic generator for a configurable GitHub developer profile command center."
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
