[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-command-center"
version = "1.1.0"
description = "Deterministic generator for a configurable GitHub developer profile command center."
requires-python = ">=3.10"
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
developer-command-center = "generator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
